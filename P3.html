<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitSphere Training Reservation</title>
</head>
<body>

    <h2>FitSphere Fitness</h2>
    <h3>Personal Training Reservation Form</h3>
    <p>Book Your Fitness Session!</p>

    <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[0-9]{10}"
               placeholder="10-digit phone number" required>
        <br><br>

        <label for="trainer">Training Type:</label>
        <select id="trainer" name="trainer" required>
            <option value="">Select Training</option>
            <option value="Personal Training">Personal Training</option>
            <option value="Yoga">Yoga Session</option>
            <option value="Cardio">Cardio Training</option>
            <option value="Strength">Strength Training</option>
        </select>
        <br><br>

        <label for="date">Session Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>

        <label for="time">Preferred Time:</label>
        <input type="time" id="time" name="time" required>
        <br><br>

        <label for="goals">Fitness Requirements:</label>
        <br>
        <textarea id="goals" name="goals"
                  rows="4" cols="30"
                  placeholder="Describe your fitness goals"></textarea>
        <br><br>

        <input type="submit" value="Book Session">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
